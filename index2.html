<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perbandingan Icon Pack</title>

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Remix Icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>

    <!-- Heroicons (pakai unpkg SVG inline, nanti dipanggil di body) -->
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f9f9f9;
            color: #333;
        }

        h2 {
            margin-top: 30px;
        }

        .icon-set {
            display: flex;
            gap: 20px;
            align-items: center;
            margin: 15px 0;
            padding: 15px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        i,
        svg {
            font-size: 28px;
            width: 28px;
            height: 28px;
        }
    </style>
</head>

<body>

    <h1>🔍 Perbandingan Icon Pack Populer</h1>

    <h2>1. Font Awesome</h2>
    <div class="icon-set">
        <i class="fa-solid fa-user"></i>
        <i class="fa-solid fa-house"></i>
        <i class="fa-brands fa-facebook"></i>
        <i class="fa-solid fa-heart"></i>
    </div>

    <h2>2. Remix Icon</h2>
    <div class="icon-set">
        <i class="ri-user-3-fill"></i>
        <i class="ri-home-4-fill"></i>
        <i class="ri-facebook-fill"></i>
        <i class="ri-heart-3-fill"></i>
    </div>

    <h2>3. Feather Icons</h2>
    <div class="icon-set">
        <i data-feather="user"></i>
        <i data-feather="home"></i>
        <i data-feather="facebook"></i>
        <i data-feather="heart"></i>
    </div>

    <h2>4. Heroicons</h2>
    <div class="icon-set">
        <!-- User -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M5.121 17.804A9.001 9.001 0 0112 15c2.21 0 4.21.896 5.657 2.343M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <!-- Home -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 9.75L12 3l9 6.75V21a1.5 1.5 0 01-1.5 1.5H4.5A1.5 1.5 0 013 21V9.75z" />
        </svg>
        <!-- Facebook (Heroicons tidak ada brand, jadi aku pakai globe) -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 21c4.97 0 9-4.03 9-9S16.97 3 12 3 3 7.03 3 12s4.03 9 9 9z" />
        </svg>
        <!-- Heart -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="red" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 
           5.42 4.42 3 7.5 3c1.74 0 3.41.81 
           4.5 2.09C13.09 3.81 14.76 3 
           16.5 3 19.58 3 22 5.42 22 
           8.5c0 3.78-3.4 6.86-8.55 
           11.54L12 21.35z" />
        </svg>
    </div>

    <script>
        // Aktifkan Feather Icons
        feather.replace();
    </script>
</body>

</html>
